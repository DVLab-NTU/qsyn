name: llvm-clang test (MacOS)

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3
      - name: Download llvm-clang, parallel, coreutils and OpenBLAS
        run: |
          brew install llvm@18 parallel coreutils openblas gmp mpfr
          # macos-latest ships Homebrew llvm (currently @20). llvm@18 is keg-only
          # until that keg is unlinked, so `clang++` would stay LLVM 20.
          brew unlink llvm || true
          brew link --force --overwrite llvm@18
          LLVM18="$(brew --prefix llvm@18)"
          echo "${LLVM18}/bin" >> "$GITHUB_PATH"
          {
            echo "CC=${LLVM18}/bin/clang"
            echo "CXX=${LLVM18}/bin/clang++"
            echo "LDFLAGS=-L${LLVM18}/lib -L$(brew --prefix openblas)/lib"
            echo "CPPFLAGS=-I${LLVM18}/include -I$(brew --prefix openblas)/include"
            echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas)"
          } >> "$GITHUB_ENV"

      - name: Build and test qsyn
        run: |
          which clang++
          clang++ --version
          echo "Building qsyn using $(sysctl -n hw.logicalcpu) cores"
          mkdir -p build
          make test -j "$(sysctl -n hw.logicalcpu)"
